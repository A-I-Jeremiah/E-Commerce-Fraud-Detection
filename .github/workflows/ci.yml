name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Lint with ruff (if available)
        run: |
          pip install ruff
          ruff check src api scripts --ignore E501 || true

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=src --cov-report=term-missing

      - name: Run integration tests
        run: |
          pytest tests/integration -v || true
        # Integration tests may be skipped if artifacts are not present in CI.
        # In a full setup you would cache or generate minimal artifacts.